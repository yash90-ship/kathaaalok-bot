<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Dev;src:url(file:///usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf)}
@font-face{font-family:DevSerif;src:url(file:///usr/share/fonts/truetype/noto/NotoSerifDevanagari-Bold.ttf)}
@font-face{font-family:Lat;src:url(file:///usr/share/fonts/truetype/noto/NotoSans-Bold.ttf)}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Lat,Dev,sans-serif}
#v{position:absolute;left:0;top:0}
#ov{position:absolute;inset:0}
#grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.07;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 70%,rgba(0,0,0,.18) 100%)}
.cap{position:absolute;left:40px;right:40px;top:60px;text-align:center;font:800 74px/1.35 Lat,Dev;color:#fff;
  text-shadow:0 0 3px #111,5px 0 0 #111,-5px 0 0 #111,0 5px 0 #111,0 -5px 0 #111,4px 4px 0 #111,-4px 4px 0 #111,4px -4px 0 #111,-4px -4px 0 #111,0 10px 18px rgba(0,0,0,.35);transform-origin:50% 50%}
.cap .hl{color:#ffc94a}
.cap.hook{top:70px;font-size:88px}
.hookbg{position:absolute;left:0;right:0;top:0;height:520px;background:linear-gradient(rgba(0,0,0,.35),transparent)}
.src{position:absolute;left:50%;top:880px;width:760px;padding:34px 20px 30px;background:#fbe9c6;border:6px solid #6e141e;border-radius:22px;
  box-shadow:0 0 0 4px #e8781e inset,0 18px 50px rgba(0,0,0,.6);text-align:center}
.srct{font:800 64px DevSerif,Lat;color:#6e141e}.srcs{font:800 44px DevSerif,Lat;color:#e8781e}
.line{height:4px;width:320px;background:#e8781e;margin:12px auto}
.lbl{position:absolute;left:50%;top:1420px;padding:10px 40px;background:#fbe9c6;border:5px solid #e8781e;border-radius:60px;font:800 50px Lat,Dev;color:#6e141e;white-space:nowrap}
.cta{position:absolute;left:50%;top:560px;text-align:center}
.ctat{display:inline-block;padding:18px 54px;background:#6e141e;border:6px solid #ffc94a;border-radius:20px;font:800 96px Lat,Dev;color:#ffc94a;white-space:nowrap}
.ctas{font:800 50px Lat,Dev;color:#fff;margin:22px 0;text-shadow:0 0 8px #000,3px 3px 0 #000}
.fol{display:inline-block;padding:16px 46px;background:#e8781e;border-radius:60px;font:800 54px Lat,Dev;color:#fff}
.wm{position:absolute;top:1790px;width:100%;text-align:center;font:700 30px Lat;color:rgba(255,255,255,.8);text-shadow:0 0 6px #000}
</style></head><body><div id="stage"><svg id="v" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<canvas id="grain" width="540" height="960" style="width:1080px;height:1920px"></canvas><div id="vig"></div><div id="ov"></div></div>
<script>
(function(){const c=document.getElementById('grain'),x=c.getContext('2d'),d=x.createImageData(540,960);
for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0)})();
</script>
<script src="engine.js"></script><script src="cutout.js"></script><script src="timeline.js"></script><script src="scenes.js"></script>
</body></html>
