# ---- kathaaalok reel bot settings (edit freely) ----
page:
  handle: kathaaalok
  niche: "Hindu mythological stories (पौराणिक कथाएँ) from the Puranas, Ramayana and Mahabharata"
  language: Hindi
  timezone: Asia/Kolkata

# Posting times (IST). The generate workflow runs ~75 min before each slot.
slots: ["13:00", "20:00"]

approval:
  # Until this date every reel is sent to Telegram and only posts if you tap "Post".
  # After it, reels post automatically (you still get a Telegram copy).
  required_until: "2026-12-06"

quality:
  ideas_per_run: 10
  min_score: 7.5        # ideas scoring below this are rejected
  avoid_repeat_days: 30 # don't repeat a story posted in the last N days

models:
  text: [gemini-3.5-flash, gemini-3.8-flash, gemini-3.7-flash, gemini-3.6-flash, gemini-3.5-flash-lite, gemini-3.1-flash-lite]
  voice_engine: parler   # parler = free AI4Bharat Indic Parler-TTS (Aman) with emotion director; edge = Microsoft voice
  tts: gemini-2.5-flash-preview-tts
  tts_voice: Charon
  tts_style: >-
    Read the following Hindi story aloud like an engaging, deep-voiced devotional storyteller
    on Instagram Reels. Keep a lively, natural pace (never slow or dragging), with energy and
    emotion, brief dramatic pauses only at key moments, and a short pause between paragraphs.
  fallback_voice: hi-IN-MadhurNeural
  fallback_rate: "+30%"

images:
  provider: cloudflare          # cloudflare -> placeholder
  # flux-1-schnell costs ~60 of the 10,000 free daily "neurons" per image; lucid-origin is far pricier
  cloudflare_models: ["@cf/black-forest-labs/flux-1-schnell"]
  gemini_models: ["gemini-3.1-flash-image", "gemini-2.5-flash-image", "gemini-3.1-flash-lite-image", "gemini-nano-banana-2.1"]
  style: >-
    Indian miniature painting in the Pahari and Rajasthani tradition, fine brushwork,
    gold leaf accents, deep indigo, saffron and emerald palette, textured handmade paper,
    soft divine glow, cinematic lighting, dignified and respectful depiction of deities,
    vertical composition with the main subject centered, no text, no letters, no watermark

video:
  width: 1080
  height: 1920
  fps: 30
  crossfade: 0.4
  music_volume: 0.12

instagram:
  graph_version: v27.0

media:
  repo: yash90-ship/kathaaalok-media
  branch: main
  pages_base: https://yash90-ship.github.io/kathaaalok-media
