name: 6 - Check approvals (replacement on skip)
# Every ~20 min in the approval windows before each slot: reads the Telegram ✅/❌ taps.
# ❌ -> starts the pre-written replacement reel for the same slot right away.
on:
  schedule:
    - cron: "*/20 0-3 * * *"     # 05:30-09:10 IST window for the 09:00 slot
    - cron: "*/20 9-12 * * *"    # 14:30-18:10 IST window for the 18:20 slot
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: bot-state
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Check taps
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.cli decide
      - name: Save state
        if: always()
        run: |
          git config user.name "kathaaalok-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data jobs
          git diff --cached --quiet && exit 0
          git commit -m "bot: approvals [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
