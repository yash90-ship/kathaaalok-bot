name: 5 - Render drawn reel
# A Claude session pushes jobs/<id>/ (script.json with speaker+emotion per line, scenes.js, meta.json).
# This voices it with Aman (Indic Parler-TTS + emotion director), renders the animation and delivers it.
on:
  push:
    paths: ["jobs/**/meta.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: render
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache AI voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-indic-parler-tts-v1
      - name: Install
        run: |
          # free ~10 GB of runner disk (unused SDKs) for the voice model
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core >/dev/null
          export PIP_NO_CACHE_DIR=1
          # CPU-only torch first, so parler-tts doesn't pull the multi-GB GPU build
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
          pip install -q git+https://github.com/huggingface/parler-tts.git soundfile --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -q -U protobuf sentencepiece
          python -c "import torch; print('torch', torch.__version__)"
          df -h / | tail -1
          npm install --silent && npx playwright install --with-deps chromium >/dev/null
      - name: Voice + render + deliver
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          for d in jobs/*/; do
            id=$(basename "$d"); [ -f "queue/$id/meta.json" ] && continue
            echo "=== $id"
            python -m drawn.make "$d"
            mkdir -p "queue/$id" && cp "$d"/reel.mp4 "$d"/cover.jpg "$d"/script.json "$d"/meta.json "queue/$id/"
          done
          python -m bot.cli deliver
      - name: Save state
        if: always()
        run: |
          git config user.name "kathaaalok-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue data
          git diff --cached --quiet && exit 0
          git commit -m "bot: rendered + delivered [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
