name: Test - Indic Parler voice
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache AI voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-indic-parler-tts-v1
      - name: Install
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -hide_banner -filters | grep -c rubberband
          pip install -q git+https://github.com/huggingface/parler-tts.git soundfile
          # swap in the CPU builds of torch/torchaudio (GitHub runners have no GPU)
          TV=$(pip show torch | awk '/^Version/{print $2}' | cut -d+ -f1)
          AV=$(pip show torchaudio 2>/dev/null | awk '/^Version/{print $2}' | cut -d+ -f1)
          pip install -q --force-reinstall --no-deps "torch==$TV" ${AV:+"torchaudio==$AV"} --index-url https://download.pytorch.org/whl/cpu
          pip install -q -U protobuf sentencepiece
          python -c "import torch, parler_tts, google.protobuf; from google.protobuf import runtime_version; print('torch', torch.__version__)"
      - name: Generate clips
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tools/voice_variants.py
      - name: Save clips
        if: always()
        run: |
          git config user.name "kathaaalok-bot"
          git config user.email "actions@users.noreply.github.com"
          git add voice-tests || true
          git diff --cached --quiet && exit 0
          git commit -m "voice test clips [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
