name: 2 - Publish reel
on:
  schedule:
    # GitHub sometimes starts scheduled jobs late or skips one, so each slot has 3 tries;
    # the first one that runs posts, the later ones see "already posted" and do nothing.
    - cron: "27 3 * * *"   # 08:57 IST
    - cron: "39 3 * * *"   # 09:09 IST (retry)
    - cron: "53 3 * * *"   # 09:23 IST (retry)
    - cron: "47 12 * * *"  # 18:17 IST
    - cron: "59 12 * * *"  # 18:29 IST (retry)
    - cron: "13 13 * * *"  # 18:43 IST (retry)
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot (13:00, 20:00 or auto)"
        default: auto
permissions:
  contents: write
concurrency: bot-state
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          pip install -q -r requirements.txt
      - name: Publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: python -m bot.cli publish --slot "${{ inputs.slot || 'auto' }}"
      - name: Alert owner on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ '${{ github.workflow }}' failed. Nothing was posted by this run. The system keeps going; next runs retry automatically." >/dev/null
      - name: Save state
        if: always()
        run: |
          git config user.name "kathaaalok-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "bot: update state [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
