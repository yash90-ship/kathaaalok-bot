name: Research - Study pages
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Instagram usernames, comma separated"
        default: "granthvani,kavimotion4,divinestoriesstudio,thelostpuranas,pauranik.didi"
  schedule:
    - cron: "23 2 * * 1"   # every Monday 07:53 IST
permissions:
  contents: write
concurrency: bot-state
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Study pages
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m bot.cli study --pages "${{ inputs.pages || 'granthvani,kavimotion4,divinestoriesstudio,thelostpuranas,pauranik.didi' }}"
      - name: Save report
        if: always()
        run: |
          git config user.name "kathaaalok-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "research: niche report [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
