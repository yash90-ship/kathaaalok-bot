name: 7 - Waiter (posts exactly on time)
# Started automatically when a reel is delivered. Stays awake until the slot, checks Skip taps every
# minute (replacement starts immediately), and posts at 09:00 / 18:20. Cron jobs are only a backup.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Reel id, e.g. 2026-11-20_0900"
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: waiter-${{ inputs.id }}
  cancel-in-progress: false
jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Wait, watch Skip taps, post on time
        env:
          GH_TOKEN: ${{ github.token }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          git config user.name "kathaaalok-bot"
          git config user.email "actions@users.noreply.github.com"
          python -m bot.cli wait --id "${{ inputs.id }}"
      - name: Alert owner on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ Waiter for ${{ inputs.id }} failed. Backup post attempts will still run at the slot time." >/dev/null
